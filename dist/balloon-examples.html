<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>말풍선 예시 16종 · SCROLL STUDIO</title><style>
*{box-sizing:border-box}body{margin:0;background:#272d34;color:#ecf4fc;font:15px "Malgun Gothic",sans-serif}header{max-width:1200px;margin:auto;padding:26px 24px 20px;display:flex;align-items:center;justify-content:space-between;gap:20px}h1{font-size:22px;margin:0 0 8px}p{color:#becddd;line-height:1.6;margin:0}nav{display:flex;gap:8px;flex-wrap:wrap}button,a{font:inherit;color:inherit}button{background:#238ed2;border:1px solid #70caff;border-radius:5px;padding:10px 14px;cursor:pointer}a{color:#7fcaff;text-decoration:none}main{max-width:1200px;margin:auto;padding:0 24px 32px}canvas{display:block;width:100%;height:auto;border-radius:12px;box-shadow:0 10px 40px #0004}footer{margin-top:20px;display:flex;gap:24px;flex-wrap:wrap;font-size:13px}button:focus-visible,a:focus-visible{outline:2px solid #78cfff;outline-offset:3px}@media(max-width:700px){header{align-items:start;flex-direction:column}}
</style></head><body><header><div><h1>말풍선 예시 16종</h1><p>원고에서는 말풍선 도구 → 상황별 예시 16종에서 선택할 수 있습니다.</p></div><nav><button id="savePng">PNG 저장</button><button id="saveProject">편집용 원고 저장</button></nav></header><main><canvas id="sheet" aria-label="일상 대화, 속마음, 속삭임, 전화, 외침 등 16가지 말풍선 예시"></canvas><footer><a href="./">SCROLL STUDIO 열기</a><a href="https://oyasumi-gamedev.com/manga-speech-balloon-design/" target="_blank" rel="noopener">사용자 제공 참고 글</a><a href="https://blambot.com/pages/comic-book-grammar-tradition" target="_blank" rel="noopener">Blambot 레터링 안내</a></footer></main><script type="module">
import {drawExampleSheet,makeExampleProject} from './balloon-example-sheet.js?v=20261025-release1';
const sheet=document.querySelector('#sheet');await document.fonts.ready;drawExampleSheet(sheet);
function save(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
document.querySelector('#savePng').onclick=()=>sheet.toBlob(b=>save(b,'말풍선-예시-16종.png'));
document.querySelector('#saveProject').onclick=()=>save(new Blob([JSON.stringify(makeExampleProject())],{type:'application/json'}),'말풍선-예시-16종.scroll.json');
</script></body></html>
